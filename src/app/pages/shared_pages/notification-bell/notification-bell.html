<div class="notification-bell-wrapper">
  <button
    type="button"
    class="bell-button"
    (click)="toggle()"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen"
    [attr.aria-label]="unreadCount > 0 ? unreadCount + ' notifications non lues' : 'Notifications'"
  >
    <i class="material-icons" aria-hidden="true">notifications</i>
    @if (unreadCount > 0) {
      <span class="badge" aria-hidden="true">{{ unreadBadgeLabel }}</span>
    }
  </button>

  @if (isOpen) {
    <div class="dropdown-panel" role="region" aria-label="Liste des notifications">
      <div class="dropdown-header">
        <strong>Notifications</strong>
        @if (unreadCount > 0) {
          <button type="button" class="mark-all-btn" (click)="markAllAsRead.emit()">
            Tout marquer comme lu
          </button>
        }
      </div>

      <div class="notifications-list">
        @if (notifications.length === 0) {
          <div class="empty-notification">Aucune notification</div>
        } @else {
          @for (notif of notifications; track notif.id) {
            <button
              type="button"
              class="notification-item"
              [class.unread]="!notif.read"
              [class.severity-critical]="notif.severity === 'critical'"
              [class.severity-high]="notif.severity === 'high'"
              (click)="onItemActivate(notif)"
            >
              <i class="material-icons notification-icon" aria-hidden="true">{{ notif.icon }}</i>
              <span class="notification-content">
                <span class="notification-title">{{ notif.title }}</span>
                <span class="notification-message">{{ notif.message }}</span>
                <span class="notification-date">{{ notif.date | date : "dd/MM/yyyy HH:mm" }}</span>
              </span>
              @if (!notif.read) {
                <span class="unread-dot" aria-hidden="true"></span>
              }
            </button>
          }
        }
      </div>
    </div>
  }
</div>
