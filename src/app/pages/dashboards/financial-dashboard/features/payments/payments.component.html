<section class="fin-payments" aria-label="Historique des paiements">
  <div class="fin-payments__header">
    <h2>Paiements</h2>
    <app-search-filter placeholder="Rechercher un client…" [value]="recherche()" (valueChange)="onRechercheChange($event)" />
  </div>

  <app-error-state *ngIf="erreur() as message" [message]="message" (retry)="reessayer()" />

  <ng-container *ngIf="!erreur()">
    <app-data-table
      [columns]="colonnes"
      [rows]="items()"
      [loading]="chargement()"
      emptyMessage="Aucun paiement enregistré."
    />

    <nav class="fin-pagination" *ngIf="totalPages > 1" aria-label="Pagination des paiements">
      <button type="button" [disabled]="page() <= 1" (click)="changerPage(page() - 1)">Précédent</button>
      <span>Page {{ page() }} / {{ totalPages }}</span>
      <button type="button" [disabled]="page() >= totalPages" (click)="changerPage(page() + 1)">Suivant</button>
    </nav>
  </ng-container>
</section>
