<section class="fin-dashboard" aria-label="Indicateurs financiers">
  <div class="fin-dashboard__header">
    <h2>Indicateurs</h2>
    <app-period-selector [mode]="mode()" (modeChange)="onModeChange($event)" />
  </div>

  <div class="fin-dashboard__filters">
    <input
      type="text"
      placeholder="Filtrer par zone/quartier..."
      [ngModel]="filtreZone()"
      (ngModelChange)="filtreZone.set($event)"
      (change)="onFiltresChange()"
      />
    <select [ngModel]="filtrePlanType()" (ngModelChange)="filtrePlanType.set($event); onFiltresChange()">
      <option value="">Tous les types de tarif</option>
      <option value="standard">Standard</option>
      <option value="premium">Premium</option>
      <option value="enterprise">Enterprise</option>
    </select>
    <div class="fin-dashboard__client-filter">
      <input
        type="text"
        placeholder="Filtrer par client..."
        [ngModel]="filtreClientRecherche()"
        (ngModelChange)="filtreClientRecherche.set($event)"
        (input)="rechercherClients()"
        (focus)="rechercherClients()"
        />
      <button
        type="button"
        *ngIf="filtreClientSelectionne()"
        class="fin-dashboard__client-clear"
        (click)="selectionnerClient(null)"
        title="Retirer le filtre client"
        >×</button>
      <ul class="fin-dashboard__client-dropdown" *ngIf="clientDropdownOuvert() && clientsSuggeres().length">
        <li *ngFor="let c of clientsSuggeres()" (click)="selectionnerClient(c)">
          {{ c.prenom }} {{ c.nom }} <span *ngIf="c.quartier">— {{ c.quartier }}</span>
        </li>
      </ul>
    </div>
  </div>

  <app-error-state *ngIf="erreurKpi() as message" [message]="message" (retry)="reessayerKpi()" />

  <ng-container *ngIf="!erreurKpi()">
    <div class="stats-grid" [attr.aria-busy]="chargementKpi()">
      <ng-container *ngIf="kpi() as k; else squelette">
        <app-kpi-card
          label="Solde disponible"
          icon="account_balance_wallet"
          tone="neutre"
          [value]="formatMontant(k.soldeDisponible)"
          sousTexte="Paiements moins retraits"
        />
        <app-kpi-card
          label="Total collecté"
          icon="payments"
          tone="positif"
          [value]="formatMontant(k.totalCollecte)"
        />
        <app-kpi-card
          label="Revenus nets"
          icon="trending_up"
          tone="positif"
          [value]="formatMontant(k.revenusNets)"
        />
        <app-kpi-card
          label="En attente"
          icon="schedule"
          tone="attention"
          [value]="formatMontant(k.enAttente)"
          sousTexte="Dû par les clients en retard"
        />
        <app-kpi-card
          label="Taux de recouvrement"
          icon="pie_chart"
          tone="neutre"
          [value]="k.tauxRecouvrement + '%'"
          [sousTexte]="formatMontant(k.totalCollecte) + ' collecté / ' + formatMontant(k.montantFacture) + ' facturé'"
        />
      </ng-container>
      <ng-template #squelette>
        <app-kpi-card *ngFor="let i of [0, 1, 2, 3]" [loading]="true" />
      </ng-template>
    </div>

    <app-empty-state
      *ngIf="!chargementKpi() && estVide()"
      icon="account_balance_wallet"
      message="Aucune activité financière enregistrée pour cette période."
    />
  </ng-container>

  <div class="fin-dashboard__stats-header">
    <h2>Statistiques ({{ labelPeriodeGraphiques() }})</h2>
    <div class="fin-dashboard__fenetre-group">
      <button
        *ngFor="let n of optionsFenetre"
        type="button"
        class="fin-dashboard__fenetre-btn"
        [class.fin-dashboard__fenetre-btn--active]="periodeMode() === 'fenetre' && nombreMoisGraphiques() === n"
        (click)="setFenetre(n)"
      >
        {{ n }} mois
      </button>
    </div>
    <div class="fin-dashboard__periode-perso">
      <input
        type="month"
        class="fin-dashboard__periode-input"
        [ngModel]="customDebutMois()"
        (ngModelChange)="customDebutMois.set($event)"
        aria-label="Mois de début"
      />
      <span class="fin-dashboard__periode-sep">→</span>
      <input
        type="month"
        class="fin-dashboard__periode-input"
        [ngModel]="customFinMois()"
        (ngModelChange)="customFinMois.set($event)"
        aria-label="Mois de fin"
      />
      <button type="button" class="fin-dashboard__periode-apply" (click)="appliquerPeriodePersonnalisee()">
        Appliquer
      </button>
      <button
        type="button"
        class="fin-dashboard__periode-reset"
        *ngIf="periodeMode() === 'personnalisee' || customDebutMois() || customFinMois()"
        (click)="reinitialiserPeriodePersonnalisee()"
        title="Réinitialiser la période personnalisée"
      >
        <i class="material-icons" aria-hidden="true">refresh</i>
      </button>
    </div>
    <button type="button" class="fin-dashboard__export-btn" (click)="exporterCsv()">
      <i class="material-icons" aria-hidden="true">download</i>
      Exporter (CSV)
    </button>
  </div>
  <p class="fin-dashboard__periode-error" *ngIf="erreurPeriodePersonnalisee() as message">{{ message }}</p>

  <app-error-state *ngIf="erreurGraphiques() as message" [message]="message" (retry)="reessayerGraphiques()" />

  <div class="fin-dashboard__charts" *ngIf="!erreurGraphiques()">
    <app-finance-chart
      titre="Total collecté par mois"
      [config]="configCollecte()"
      [tableRows]="lignesCollecte()"
      [loading]="chargementGraphiques()"
    />
    <app-finance-chart
      titre="Factures payées / impayées"
      [config]="configPayeesImpayees()"
      [tableRows]="lignesPayeesImpayees()"
      [loading]="chargementGraphiques()"
    />
    <app-finance-chart
      titre="Répartition par mode de paiement"
      [config]="configRepartition()"
      [tableRows]="lignesRepartition()"
      [loading]="chargementGraphiques()"
    />
  </div>
</section>
