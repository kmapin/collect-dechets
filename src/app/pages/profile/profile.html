<div class="profile-page profile-flex-layout">
  <div class="profile-left">
    <div class="profile-header-modern">
      <img
        class="profile-avatar"
        [src]="user.avatar || 'https://images.pexels.com/photos/771742/pexels-photo-771742.jpeg?auto=compress&cs=tinysrgb&w=100&h=100&fit=crop'"
        [alt]="user.firstName"
      />
      <div class="profile-user-info">
        <h2>{{ user.firstName || user.name }} {{ user.lastName || '' }}</h2>
        <span class="role-badge">{{ getRoleLabel(user.role) }}</span>
        <p class="profile-email">
          <i class="material-icons">email</i> {{ user.email }}
        </p>
      </div>
    </div>
    <!-- Afficher le code QR et telecharger  -->
    <div class="profile-card-modern card text-center">
      <!-- <h3>Code QR</h3> -->
      <div class="qr-code">
        <img [src]="generateQRCode(user?.qrCodeImage)" alt="QR Code" />
      </div>
      <a
        [href]="generateQRCode(user?.qrCodeImage)"
        download="qrcode.png"
        class="btn btn-primary mt-2"
        >Télécharger le QR Code</a
      >
    </div>
  </div>
  <div class="profile-right">
    <div class="profile-card-modern card">
      <!-- Formulaire CLIENT -->
      <form
        *ngIf="user.role === 'client'"
        class="profile-form-modern"
        (ngSubmit)="onSave()"
      >
        <h3>Informations personnelles du client</h3>
        <div class="form-row-modern">
          <div class="form-group-modern">
            <label for="firstName"
              ><i class="material-icons">person</i> Prénom</label
            >
            <input
              type="text"
              id="firstName"
              [(ngModel)]="user.firstName"
              name="firstName"
              required
            />
          </div>
          <div class="form-group-modern">
            <label for="lastName"
              ><i class="material-icons">badge</i> Nom</label
            >
            <input
              type="text"
              id="lastName"
              [(ngModel)]="user.lastName"
              name="lastName"
              required
            />
          </div>
        </div>
        <div class="form-row-modern">
          <div class="form-group-modern">
            <label for="phone"
              ><i class="material-icons">phone</i> Téléphone</label
            >
            <input
              type="tel"
              id="phone"
              [(ngModel)]="user.phone"
              name="phone"
              required
            />
          </div>
        </div>
        <h3>Adresse</h3>
        <div class="form-row-modern" *ngIf="user.address">
          <div class="form-group-modern">
            <label for="city">Ville</label>
            <input
              type="text"
              id="city"
              [(ngModel)]="user.address.city"
              name="address.city"
            />
          </div>
          <div class="form-group-modern">
            <label for="postalCode">Code postal</label>
            <input
              type="text"
              id="postalCode"
              [(ngModel)]="user.address.postalCode"
              name="address.postalCode"
            />
          </div>
        </div>
        <div class="form-row-modern" *ngIf="user.address">
          <div class="form-group-modern">
            <label for="arrondissement">Arrondissement</label>
            <select
              id="arrondissement"
              [(ngModel)]="user.address.arrondissement"
              name="address.arrondissement"
              (change)="onArrondissementChange(user.address.arrondissement)"
            >
              <option value="">Sélectionner</option>
              <option
                *ngFor="let arr of arrondissements"
                [value]="arr.arrondissement"
              >
                {{ arr.arrondissement }}
              </option>
            </select>
          </div>
          <div class="form-group-modern">
            <label for="sector">Secteur</label>
            <select
              id="sector"
              [(ngModel)]="user.address.sector"
              name="address.sector"
              (change)="onSecteurChange(user.address.sector)"
              [disabled]="!secteurs.length"
            >
              <option value="">Sélectionner</option>
              <option *ngFor="let s of secteurs" [value]="s.secteur">
                {{ s.secteur }}
              </option>
            </select>
          </div>
          <div class="form-group-modern">
            <label for="neighborhood">Quartier</label>
            <select
              id="neighborhood"
              [(ngModel)]="user.address.neighborhood"
              name="address.neighborhood"
              [disabled]="!quartiers.length"
            >
              <option value="">Sélectionner</option>
              <option *ngFor="let q of quartiers" [value]="q">{{ q }}</option>
            </select>
          </div>
        </div>
        <div class="form-row-modern" *ngIf="user.address">
          <div class="form-group-modern">
            <label for="street">Rue</label>
            <input
              type="text"
              id="street"
              [(ngModel)]="user.address.street"
              name="address.street"
            />
          </div>
          <div class="form-group-modern">
            <label for="doorNumber">Porte</label>
            <input
              type="text"
              id="doorNumber"
              [(ngModel)]="user.address.doorNumber"
              name="address.doorNumber"
            />
          </div>
          <div class="form-group-modern">
            <label for="doorColor">Couleur de la porte</label>
            <select
              id="doorColor"
              [(ngModel)]="user.address.doorColor"
              name="address.doorColor"
            >
              <option value="">Sélectionner</option>
              <option value="blanc">Blanc</option>
              <option value="noir">Noir</option>
              <option value="marron">Marron</option>
              <option value="bleu">Bleu</option>
              <option value="rouge">Rouge</option>
              <option value="vert">Vert</option>
              <option value="autre">Autre</option>
            </select>
          </div>
        </div>
        <div class="form-row-modern">
          <!-- <div class="form-group-modern">
                <label class="checkbox-label">
                  <input type="checkbox" [(ngModel)]="user.termsAccepted" name="termsAccepted" required>
                  J'accepte les conditions générales d'utilisation
                </label>
              </div> -->
          <div class="form-group-modern">
            <label class="checkbox-label">
              <input
                type="checkbox"
                [(ngModel)]="user.receiveOffers"
                name="receiveOffers"
              />
              Je souhaite recevoir des offres et actualités
            </label>
          </div>
        </div>
        <div class="form-actions-modern">
          <button type="submit" class="btn btn-primary">
            <i class="material-icons">save</i>
            Sauvegarder
          </button>
        </div>
      </form>

          <div class="form-group-modern">

            <select

        <div class="form-actions-modern">
