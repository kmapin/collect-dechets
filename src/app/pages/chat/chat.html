<div class="page-header">
  <div class="container">
    <h1 class="page-title">Messagerie</h1>
    <p class="page-subtitle">
      Contactez une agence en temps réel pour toute demande ou signalement.
    </p>
  </div>
</div>
<div class="chat-container card">
  <div
    class="chat-sidebar"
    [class.mobile-hidden]="selectedConversation && isMobileView"
    >
    <app-conversation-list
      [conversations]="conversations"
      [selectedConversation]="selectedConversation"
      [currentUser]="currentUser"
      (conversationSelected)="onConversationSelect($event)"
      (search)="onSearch($event)"
    ></app-conversation-list>
  </div>

  <div
    class="chat-main-content"
    [class.mobile-hidden]="!selectedConversation && isMobileView"
    >
    @if (selectedConversation && isMobileView) {
      <button
        class="back-button"
        (click)="goBack()"
        >
        <i class="pi pi-arrow-left"></i>
        Back
      </button>
    }
    <app-chat-window
      [conversation]="selectedConversation"
      [messages]="messages"
      [currentUser]="currentUser"
      [typingIndicators]="typingIndicators"
      (sendMessage)="onSendMessage($event)"
      (typing)="onTyping()"
    ></app-chat-window>
  </div>
</div>
